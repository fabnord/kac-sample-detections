# KAC default rule 106561: Container(s) without runAsNonRoot (Medium)
# Triggers: Neither the container nor the Pod sets securityContext.runAsNonRoot: true.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106561-container-without-runasnonroot.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106561
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
