# KAC default rule 106577: Workload without SELinux or AppArmor (Medium)
# Triggers: No seLinuxOptions or AppArmor profile is configured at Pod or container level.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106577-no-selinux-or-apparmor.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106577
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
