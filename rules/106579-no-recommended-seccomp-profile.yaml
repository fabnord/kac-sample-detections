# KAC default rule 106579: Workload without recommended seccomp profile (Medium)
# Triggers: seccompProfile.type is not RuntimeDefault at container or Pod level.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106579-no-recommended-seccomp-profile.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106579
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
