# KAC default rule 106568: Container(s) with sysadmin capability (Medium)
# Triggers: CAP_SYS_ADMIN is not dropped (capabilities.drop lists neither ALL nor SYS_ADMIN).
# Also triggers: 106578
# Note: NET_RAW is dropped so that 106563 stays quiet.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106568-container-with-sys-admin-capability.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106568
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
