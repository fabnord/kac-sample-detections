# KAC default rule 106581: Container runtime socket in container(s) (Informational)
# Triggers: A hostPath volume whose path contains docker.sock, containerd.sock or crio.sock is mounted into a container.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106581-container-runtime-socket-mounted.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106581
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
      volumeMounts:
        - name: cri-socket
          mountPath: /var/run/cri.sock
  volumes:
    - name: cri-socket
      hostPath:
        path: /run/containerd/containerd.sock
