# KAC default rule 106574: Container(s) in host IPC namespace (Medium)
# Triggers: Pod spec.hostIPC: true.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106574-host-ipc-namespace.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106574
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
  hostIPC: true
