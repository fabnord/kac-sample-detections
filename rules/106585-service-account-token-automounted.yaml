# KAC default rule 106585: Service account token automounted (Medium)
# Triggers: spec.automountServiceAccountToken is not set to false, so the service account token is mounted.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106585-service-account-token-automounted.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106585
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
