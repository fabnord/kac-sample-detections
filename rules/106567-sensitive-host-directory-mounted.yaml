# KAC default rule 106567: Sensitive host directories mounted in container(s) (Medium)
# Triggers: A hostPath volume for /, /etc, /var, /bin, /sbin, /proc (or a subpath) is mounted into a container.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106567-sensitive-host-directory-mounted.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106567
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
      volumeMounts:
        - name: host-etc
          mountPath: /host-etc
          readOnly: true
  volumes:
    - name: host-etc
      hostPath:
        path: /etc
