# KAC default rule 106559: Sensitive data in secretKeyRef (Medium)
# Triggers: An env var is populated through valueFrom.secretKeyRef. optional: true lets the Pod start without the Secret existing.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106559-sensitive-data-in-secretkeyref.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106559
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-db-credentials
              key: password
              optional: true
