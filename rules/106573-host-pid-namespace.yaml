# KAC default rule 106573: Container(s) in host PID namespace (Medium)
# Triggers: Pod spec.hostPID: true.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106573-host-pid-namespace.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106573
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
  hostPID: true
