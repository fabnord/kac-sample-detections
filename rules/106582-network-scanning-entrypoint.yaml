# KAC default rule 106582: Container(s) entrypoint contains network scanning command (Informational)
# Triggers: The container command contains nmap, masscan, zmap, pnscan or nc -z. This one only scans localhost.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106582-network-scanning-entrypoint.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106582
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: instrumentisto/nmap:latest
      command:
        - nmap
        - "-sn"
        - "127.0.0.1"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
