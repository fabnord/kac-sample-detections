# KAC default rule 106583: Container(s) entrypoint contains chroot command (Medium)
# Triggers: The container command contains chroot /host or chroot /mnt (a common host-escape pattern).
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106583-chroot-in-entrypoint.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106583
  namespace: kac-demo
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - /bin/sh
        - "-c"
        - "chroot /host /bin/true; sleep 3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
