# KAC default rule 106575: Workload in default namespace (Medium)
# Triggers: The workload is created in the default namespace.
# Note: This is the only manifest that does not use the kac-demo namespace.
# Apply: kubectl apply -f namespace.yaml && kubectl apply -f rules/106575-workload-in-default-namespace.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: kac-106575
  namespace: default
  labels:
    app: kac-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
